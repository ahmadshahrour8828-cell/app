
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-db
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: api-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        DATABASE_URL: "postgresql+psycopg://{{ .username }}:{{ .password }}@postgres.database.svc.cluster.local:5432/appdb"
  data:
    - secretKey: username
      remoteRef:
        key: postgres
        property: username
    - secretKey: password
      remoteRef:
        key: postgres
        property: password
