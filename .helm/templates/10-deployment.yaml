---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dev
spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app: api
  replicas: 2
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: app
          imagePullPolicy: IfNotPresent
          image: 715489363281.dkr.ecr.eu-central-1.amazonaws.com/api:531ce37482fb2d1b61cd9db93968820591f15681
          command:
            - uvicorn
          args:
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - name: DB_HOST
              value: "postgres.database.svc.cluster.local"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_PORT
              value: "5432"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: [ "/bin/bash", "-c", "sleep 5; kill -QUIT 1" ]
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthcheck/liveness
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthcheck/liveness
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
          resources:
            {{ toYaml (.Values.resources.app) | nindent 12 }}

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP