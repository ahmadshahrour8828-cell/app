---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dev
spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app: api
  replicas: 2
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: app
          imagePullPolicy: IfNotPresent
          image: 715489363281.dkr.ecr.eu-central-1.amazonaws.com/api:a4d6fa87fb56130a2b74954a7a89039bc51d988f
          command:
            - uvicorn
          args:
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://appuser:2hJVsI19ev4@postgres.database.svc.cluster.local:5432/appdb
            - name: POSTGRES_USER
              value: appuser
            - name: POSTGRES_PASSWORD
              value: 2hJVsI19ev4
            - name: POSTGRES_DB
              value: appdb
            - name: DB_PORT
              value: "5432"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: [ "/bin/bash", "-c", "sleep 5; kill -QUIT 1" ]
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthcheck/liveness
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthcheck/liveness
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
          resources:
            {{ toYaml (.Values.resources.app) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP