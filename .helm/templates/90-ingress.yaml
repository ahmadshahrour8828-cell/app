---
{{- $host := (.Values.app.url) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
      paths:
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: api
              port:
                name: http