app:
  hpa:
    enabled: true
    replicas:
      min: 2
      max: 4
    averageValue: 80
  ingressClass: nginx
  whitelist: "0.0.0.0/0"
  image: 715489363281.dkr.ecr.eu-central-1.amazonaws.com/api:latest
  env: dev
  url: localhost

resources:
  app:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1024Mi